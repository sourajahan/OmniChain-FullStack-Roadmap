services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /app/data/searchmedia.db
      UPLOAD_DIR: /app/uploads
      CACHE_TTL_SECONDS: 60
    ports:
      - "8001:8001"
    volumes:
      - media_uploads:/app/uploads
      - media_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  media_uploads:
  media_data:
