<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0D1117; stroke: #30363D; stroke-width: 1.5; }
    .tier { fill: #161B22; stroke: #30363D; stroke-width: 1; stroke-dasharray: 4 3; }
    .tlbl { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8B949E; letter-spacing: 0.6px; }
    .title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
    .sub { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; opacity: 0.9; }
    .line { stroke: #64748B; stroke-width: 1.8; fill: none; }
  </style>

  <rect x="2" y="2" width="876" height="396" rx="14" class="bg"/>

  <!-- Tier 1: Edge -->
  <rect x="18" y="16" width="844" height="88" rx="10" class="tier"/>
  <text x="32" y="34" class="tlbl">EDGE, PORTAL &amp; SECURITY LAYER</text>
  <rect x="130" y="44" width="260" height="48" rx="8" fill="#0284C7"/>
  <text x="260" y="65" text-anchor="middle" class="title">03 OmniStore Portal</text>
  <text x="260" y="81" text-anchor="middle" class="sub">React · TypeScript · Tailwind</text>
  <path d="M 390 68 L 486 68" class="line" marker-end="url(#arr)"/>
  <rect x="490" y="44" width="260" height="48" rx="8" fill="#0EA5E9"/>
  <text x="620" y="65" text-anchor="middle" class="title">05 CloudShield Gateway</text>
  <text x="620" y="81" text-anchor="middle" class="sub">Nginx · TLS · Rate Limit · OWASP</text>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <path d="M 620 92 L 620 120 M 127 120 L 751 120" class="line"/>
  <path d="M 127 120 L 127 162" class="line" marker-end="url(#arr)"/>
  <path d="M 335 120 L 335 162" class="line" marker-end="url(#arr)"/>
  <path d="M 543 120 L 543 162" class="line" marker-end="url(#arr)"/>
  <path d="M 751 120 L 751 162" class="line" marker-end="url(#arr)"/>

  <!-- Tier 2: Core & Async -->
  <rect x="18" y="138" width="844" height="102" rx="10" class="tier"/>
  <text x="32" y="156" class="tlbl">CORE COMMERCE, LOGISTICS &amp; ASYNC QUEUE</text>
  <rect x="32" y="166" width="190" height="58" rx="8" fill="#4F46E5"/>
  <text x="127" y="191" text-anchor="middle" class="title">02 CoreAuth &amp; Orders</text>
  <text x="127" y="208" text-anchor="middle" class="sub">FastAPI · JWT · RBAC</text>

  <rect x="240" y="166" width="190" height="58" rx="8" fill="#6366F1"/>
  <text x="335" y="191" text-anchor="middle" class="title">04 Search &amp; Media</text>
  <text x="335" y="208" text-anchor="middle" class="sub">Redis Cache · Docker</text>

  <rect x="448" y="166" width="190" height="58" rx="8" fill="#7C3AED"/>
  <text x="543" y="191" text-anchor="middle" class="title">07 Enterprise Core</text>
  <text x="543" y="208" text-anchor="middle" class="sub">Multi-Warehouse · Logistics</text>

  <rect x="656" y="166" width="190" height="58" rx="8" fill="#D97706"/>
  <text x="751" y="191" text-anchor="middle" class="title">06 Async Queue &amp; LB</text>
  <text x="751" y="208" text-anchor="middle" class="sub">Redis · DLQ · Nginx LB</text>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <path d="M 543 224 L 543 256 M 127 256 L 751 256" class="line"/>
  <path d="M 127 256 L 127 298" class="line" marker-end="url(#arr)"/>
  <path d="M 335 256 L 335 298" class="line" marker-end="url(#arr)"/>
  <path d="M 543 256 L 543 298" class="line" marker-end="url(#arr)"/>
  <path d="M 751 256 L 751 298" class="line" marker-end="url(#arr)"/>

  <!-- Tier 3: Hyperscale -->
  <rect x="18" y="274" width="844" height="106" rx="10" class="tier"/>
  <text x="32" y="292" class="tlbl">HYPERSCALE, AI VECTOR SEARCH &amp; MULTI-REGION INFRASTRUCTURE</text>
  <rect x="32" y="302" width="190" height="58" rx="8" fill="#059669"/>
  <text x="127" y="327" text-anchor="middle" class="title">08 AI Vector Search</text>
  <text x="127" y="344" text-anchor="middle" class="sub">Cosine Similarity Engine</text>

  <rect x="240" y="302" width="190" height="58" rx="8" fill="#10B981"/>
  <text x="335" y="327" text-anchor="middle" class="title">08 Distributed Saga</text>
  <text x="335" y="344" text-anchor="middle" class="sub">Auto Compensation</text>

  <rect x="448" y="302" width="190" height="58" rx="8" fill="#DB2777"/>
  <text x="543" y="327" text-anchor="middle" class="title">Apache Kafka KRaft</text>
  <text x="543" y="344" text-anchor="middle" class="sub">Event Streaming Backbone</text>

  <rect x="656" y="302" width="190" height="58" rx="8" fill="#E11D48"/>
  <text x="751" y="327" text-anchor="middle" class="title">K8s HPA + OTel</text>
  <text x="751" y="344" text-anchor="middle" class="sub">EU/US · Prom · Grafana</text>
</svg>
