<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0D1117; stroke: #30363D; stroke-width: 1.5; }
    .t { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
    .s { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; opacity: 0.9; }
    .ok { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #10B981; }
    .er { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EF4444; }
    .ln { stroke: #64748B; stroke-width: 1.8; fill: none; }
    .lr { stroke: #EF4444; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
  </style>

  <rect x="2" y="2" width="876" height="216" rx="14" class="bg"/>

  <!-- Happy Path Row -->
  <rect x="20" y="34" width="146" height="54" rx="8" fill="#2563EB"/>
  <text x="93" y="57" text-anchor="middle" class="t">Checkout Request</text>
  <text x="93" y="74" text-anchor="middle" class="s">Idempotency-Key</text>
  <path d="M 166 61 L 194 61" class="ln" marker-end="url(#a2)"/>

  <rect x="198" y="34" width="146" height="54" rx="8" fill="#7C3AED"/>
  <text x="271" y="57" text-anchor="middle" class="t">1. Reserve Stock</text>
  <text x="271" y="74" text-anchor="middle" class="s">Multi-Warehouse</text>
  <path d="M 344 61 L 372 61" class="ln" marker-end="url(#a2)"/>

  <rect x="376" y="34" width="146" height="54" rx="8" fill="#7C3AED"/>
  <text x="449" y="57" text-anchor="middle" class="t">2. Capture Payment</text>
  <text x="449" y="74" text-anchor="middle" class="s">Payment Gateway</text>
  <path d="M 522 61 L 558 61" class="ln" marker-end="url(#a2)"/>
  <text x="539" y="52" text-anchor="middle" class="ok">OK</text>

  <rect x="562" y="34" width="136" height="54" rx="8" fill="#0891B2"/>
  <text x="630" y="57" text-anchor="middle" class="t">3. Dispatch Order</text>
  <text x="630" y="74" text-anchor="middle" class="s">TRK-... Code</text>
  <path d="M 698 61 L 722 61" class="ln" marker-end="url(#a2)"/>

  <rect x="726" y="34" width="134" height="54" rx="8" fill="#059669"/>
  <text x="793" y="57" text-anchor="middle" class="t">CONFIRMED</text>
  <text x="793" y="74" text-anchor="middle" class="s">Kafka: Completed</text>

  <!-- Failure / Compensation Path -->
  <path d="M 449 88 L 449 138" class="lr" marker-end="url(#ar)"/>
  <text x="478" y="118" class="er">FAILURE</text>

  <rect x="366" y="142" width="166" height="54" rx="8" fill="#DC2626"/>
  <text x="449" y="165" text-anchor="middle" class="t">Compensate Stock</text>
  <text x="449" y="182" text-anchor="middle" class="s">Release Reservation</text>
  <path d="M 532 169 L 578 169" class="lr" marker-end="url(#ar)"/>

  <rect x="582" y="142" width="176" height="54" rx="8" fill="#991B1B"/>
  <text x="670" y="165" text-anchor="middle" class="t">COMPENSATED</text>
  <text x="670" y="182" text-anchor="middle" class="s">Kafka: Compensated</text>
</svg>
