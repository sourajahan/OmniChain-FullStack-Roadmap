name: Project 2 - CoreAuth Order API CI

on:
  push:
    paths:
      - "02-CoreAuth-Order-API/**"
      - ".github/workflows/p2-coreauth-ci.yml"
  pull_request:
    paths:
      - "02-CoreAuth-Order-API/**"
      - ".github/workflows/p2-coreauth-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-CoreAuth-Order-API

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coreauth_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: coreauth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U coreauth_app -d coreauth_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://coreauth_app:ci_test_password@localhost:5433/coreauth_db
      JWT_SECRET_KEY: ci-super-secret-key-minimum-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Lint and Type Check
        run: |
          ruff check src tests
          mypy src

      - name: Run Tests with Coverage Gate (>=80%)
        run: pytest --cov=coreauth --cov-report=term-missing --cov-fail-under=80
