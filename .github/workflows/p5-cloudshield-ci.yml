name: P5 CloudShield Security CI

on:
  push:
    branches: [main]
    paths:
      - '05-CloudShield-Production-Gateway/**'
      - '.github/workflows/p5-cloudshield-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '05-CloudShield-Production-Gateway/**'
      - '.github/workflows/p5-cloudshield-ci.yml'

jobs:
  security-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-CloudShield-Production-Gateway/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -v

  infra-validation:
    runs-on: ubuntu-latest
    needs: [security-gateway]
    defaults:
      run:
        working-directory: 05-CloudShield-Production-Gateway
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/backup_db.sh
      - run: docker compose config --quiet
      - run: docker compose build
