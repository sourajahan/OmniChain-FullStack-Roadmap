name: P3 Frontend CI

on:
  push:
    branches: [main]
    paths:
      - '03-OmniStore-Frontend-Portal/**'
      - '.github/workflows/p3-frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '03-OmniStore-Frontend-Portal/**'
      - '.github/workflows/p3-frontend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-OmniStore-Frontend-Portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 03-OmniStore-Frontend-Portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Unit & Integration Tests (Vitest)
        run: npm run test

      - name: Production Build
        run: npm run build
