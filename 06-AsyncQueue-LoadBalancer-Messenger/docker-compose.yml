services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    build:
      context: ./service
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-1
      MAX_RETRIES: 3
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-2:
    build:
      context: ./service
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: api-2
      MAX_RETRIES: 3
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./service
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MAX_RETRIES: 3
    depends_on:
      redis:
        condition: service_healthy

  loadbalancer:
    image: nginx:1.27-alpine
    ports:
      - "8083:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
