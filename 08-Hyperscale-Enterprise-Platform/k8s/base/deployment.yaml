apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnichain-hyperscale
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: omnichain-hyperscale
  template:
    metadata:
      labels:
        app: omnichain-hyperscale
    spec:
      containers:
        - name: platform
          image: ghcr.io/sourajahan/omnichain-hyperscale:v2.0.0
          ports:
            - containerPort: 8005
          env:
            - name: REGION
              value: "eu-west-1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
